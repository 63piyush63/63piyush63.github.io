    <style>
        /* डार्क ब्लू साइबरपंक और प्ले स्टोर थीम वेरिएबल्स */
        :root {
            --bg-dark-blue: #020813;
            --surface-blue: #0b1528;
            --neon-cyan: #00f0ff;
            --neon-blue: #0066ff;
            --neon-red: #ff0055;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) var(--bg-dark-blue);
        }

        body, html {
            background-color: var(--bg-dark-blue);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            overflow-y: scroll;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* मैट्रिक्स एनीमेशन बैकग्राउंड */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.08; /* डार्क ब्लू को निखारने के लिए हल्का रखा है */
            pointer-events: none;
        }

        .terminal-overlay {
            position: relative;
            z-index: 2;
            max-width: 600px; /* प्ले स्टोर मोबाइल व्यू के लिए परफेक्ट चौड़ाई */
            margin: 0 auto;
            padding: 15px;
        }

        /* 1. प्रोफाइल सेक्शन (सबसे ऊपर) */
        .profile-header {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, var(--surface-blue) 0%, var(--bg-dark-blue) 100%);
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            margin-bottom: 25px;
            margin-top: 15px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-blue);
            margin: 0 auto 15px auto;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .profile-tagline {
            color: var(--neon-cyan);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 5px 0 12px 0;
            text-transform: uppercase;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 500px;
            margin: 0 auto;
        }

        /* सोशल लिंक्स ग्रिड */
        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            color: var(--text-main);
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid rgba(0, 102, 255, 0.2);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .badge:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark-blue);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* 2. लाइव सर्च पेलोड बार */
        #toolSearch {
            width: 100%;
            padding: 14px;
            background: var(--surface-blue);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            outline: none;
        }

        #toolSearch:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 3. कॉन्टैक्ट लिस्ट स्टाइल रो (Row) सिस्टम */
        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 6px; /*緊湊型 पैडिंग जिससे कॉन्टैक्ट नंबर जैसा फील आए */
        }

        .tool-item {
            display: flex;
            align-items: center;
            background-color: var(--surface-blue);
            padding: 10px 14px;
            border-radius: 12px;
            transition: all 0.15s ease;
            cursor: pointer;
            border: 1px solid transparent;
            will-change: transform; /* सुपर स्मूथ 20 पेज स्क्रॉलिंग फिजिक्स के लिए */
        }

        .tool-item:hover {
            border-color: rgba(0, 240, 255, 0.2);
            transform: translateY(-1px);
        }

        /* प्ले स्टोर टॉप चार्ट्स सीरियल नंबर */
        .tool-index {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-muted);
            width: 32px;
            flex-shrink: 0;
        }

        /* टूल आइकॉन */
        .tool-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #121d33;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .tool-details {
            flex-grow: 1;
            min-width: 0;
        }

        .tool-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .tool-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-action-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--neon-cyan);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tool-item:hover .tool-action-btn {
            background-color: var(--neon-cyan);
            color: var(--bg-dark-blue);
        }
    </style>
</head>
<body>

    <!-- मैट्रिक्स एनीमेशन -->
    <canvas id="matrix"></canvas>

    <div class="terminal-overlay">
        
                <!-- PROFILE SECTION IN ENGLISH -->
        <header class="profile-header">
<div class="profile-avatar" style="background: url('https://github.com/63piyush63.png') center/cover;"></div>
            <h1 class="profile-name">Preyar Piyush</h1>
            <div class="profile-tagline">[ White Hat Ethical Hacker & Cyber Security Analyst ]</div>
            <p class="profile-bio">Independent Cyber Security Specialist from India. Specializing in secure architectures, penetration testing, automated systems, and advanced AI directory engines.</p>
            
            <div class="badge-grid">
                <a href="https://github.com/63piyush63" class="badge" target="_blank">💻 GitHub</a>
                <a href="https://www.linkedin.com/in/63piyush63" class="badge" target="_blank">🔗 LinkedIn</a>
                <a href="https://tryhackme.com/p/63piyush63" class="badge" target="_blank">💀 TryHackMe</a>
                <a href="https://gitlab.com/63piyush63" class="badge" target="_blank">🦊 GitLab</a>
            </div>
        </header>
        

        <!-- लाइव सर्च बार इंजन -->
        <input type="text" id="toolSearch" onkeyup="filterTools()" placeholder="🔍 Enter Search Payload...">

        <h2 class="section-title">⚡ Core Tools Dashboard</h2>
        
        <!-- 20+ पेज की कॉन्टैक्ट स्क्रॉलिंग डायरेक्टरी -->
        <div class="tools-list" id="toolsListContainer"></div>

    </div>


    <!-- टूल्स जनरेटर और सर्च स्क्रिप्ट -->
<script>
    // A to Z सॉर्टेड हैकिंग टूल्स डेटाबेस
    const hackingTools = [
        { name: "Aircrack-ng", desc: "WiFi network security assessment & auditing tool" },
        { name: "Burp Suite", desc: "Web application security testing & vulnerability scanning" },
        { name: "Ghidra", desc: "NSA reverse engineering software analysis framework" },
        { name: "Hashcat", desc: "Advanced and fastest password cracking utility" },
        { name: "Metasploit", desc: "Penetration testing and exploit development framework" },
        { name: "Nmap", desc: "Network mapper and security vulnerability scanner" },
        { name: "Sqlmap", desc: "Automatic SQL injection and database takeover tool" },
        { name: "Wireshark", desc: "Interactive network packet analyzer and sniffer" }
    ].sort((a, b) => a.name.localeCompare(b.name));

    const aiTools = [
        { name: "ChatGPT", desc: "Conversational intelligence & advanced scripting assist" },
        { name: "Claude AI", desc: "Advanced code review and structural logic analysis" },
        { name: "GitHub Copilot", desc: "AI pair programmer for swift execution" },
        { name: "Midjourney", desc: "High-fidelity conceptual graphic generation engine" }
    ];

    const container = document.getElementById('toolsListContainer');
    let htmlContent = "";
    let currentGlobalIndex = 1;

    // 1. Hacking Tools Render
    hackingTools.forEach(tool => {
        htmlContent += `
            <div class="tool-item" style="border-left: 3px solid var(--neon-red);"> 
                <div class="tool-index">${currentGlobalIndex++}</div>
                <div class="tool-icon" style="color: var(--neon-red);">💀</div>
                <div class="tool-details">
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-desc">${tool.desc}</div>
                </div>
                <button class="tool-action-btn" style="color: var(--neon-red);">Launch</button>
            </div>
        `;
    });

    // 2. 20+ Pages Contact Scrolling Simulation (200 Items)
    for (let i = 1; i <= 200; i++) {
        const sample = aiTools[(i - 1) % aiTools.length];
        htmlContent += `
            <div class="tool-item">
                <div class="tool-index">${currentGlobalIndex++}</div>
                <div class="tool-icon" style="color: var(--neon-cyan);">${sample.name.substring(0,2)}</div>
                <div class="tool-details">
                    <div class="tool-name">${sample.name} #${i}</div>
                    <div class="tool-desc">${sample.desc}</div>
                </div>
                <button class="tool-action-btn">Open</button>
            </div>
        `;
    }

    container.innerHTML = htmlContent;

    // Instant Payload Filtering Function
    function filterTools() {
        let input = document.getElementById('toolSearch').value.toLowerCase();
        let items = document.getElementsByClassName('tool-item');
        
        for (let i = 0; i < items.length; i++) {
            let nameEl = items[i].querySelector('.tool-name');
            let descEl = items[i].querySelector('.tool-desc');
            
            let name = nameEl ? nameEl.innerText.toLowerCase() : "";
            let desc = descEl ? descEl.innerText.toLowerCase() : "";
            
            if (name.includes(input) || desc.includes(input)) {
                items[i].style.display = "flex";
            } else {
                items[i].style.display = "none";
            }
        }
    }

    // --- Matrix Rain Animation Engine ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const alphabet = katakana.split('');
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const rainDrops = Array.from({ length: columns }).fill(1);

    const drawMatrix = () => {
        ctx.fillStyle = 'rgba(2, 8, 19, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f0ff';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    };
    setInterval(drawMatrix, 30);
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>
</body>
</html>
